<html>
<head>
<title>Registration form</title>
<style>

.coloring
{
background:pink;
color:black;
}
.tb{
color:red;
}
</style>
<script>

function show(){

var fn=document.getElementById("fn").value;

localStorage.setItem("fn",fn);

var name1=fn.match(/[a-zA-Z\s]+$/);
if(!name1){
alert("Enter valid first name!!!");
return false;
}


var mn=document.getElementById("mn").value;


localStorage.setItem("mn",mn);


var name2=mn.match(/[a-zA-Z]?/);
if(!name2){
alert("Enter valid middle name!!!");
return false;
}

var ln=document.getElementById("ln").value;

localStorage.setItem("ln",ln);

var name3=ln.match(/[a-zA-Z]+/);
if(!name3){
alert("Enter valid last name!!!");
return false;
}

var mob=document.getElementById("mob").value;

localStorage.setItem("mob",mob);

var name5=mob.match(/[0-9]{10}/);
if(!name5){
alert("Enter valid Mobile number!!!");
return false;
}

var em=document.getElementById("em").value;

localStorage.setItem("em",em);

var name6=em.match(/[a-zA-Z0-9]+@[a-zA-Z]+.[a-zA-Z]+/);
if(!name6){
alert("Enter valid E-mail!!!");
return false;
}

var ad=document.getElementById("ad").value;
localStorage.setItem("ad",ad);

var name7=ad.match(/[a-zA-Z]+/);
if(!name7){
alert("Enter valid address!!!");
return false;
}

var gen=document.forms['reg'].gender.value;
alert(gen);

}

</script>
</head>

<body>
<body class="coloring">
<center>
<form action="my.html" name="reg">
<h2>Enter your details<h2>
<table border="5" cellpadding=8 cellspacing=7>

<tr>
<td><label>First name:</label></td>
<td><input type="text" name="fn" id="fn" onkeydown="return /[a-z\s]/i.test(event.key)"></td>
</tr>

<tr>
<td><label>Middle name:</label></td>
<td><input type="text" name="mn" id="mn"></td>
</tr>


<tr>
<td><label>Last name:</label></td>
<td><input type="text" name="ln" id="ln"></td>
</tr>


<tr>
<td><label>Mobile number:</label></td>
<td><input type="number" name="mob" id="mob"></td>
</tr>


<tr>
<td><label>E-mail :</label></td>
<td><input type="email" name="em" id="em"></td>
</tr>


<tr>
<td><label>DOB : </label></td>
<td><input type="date" name="date" id="date">
</tr>


<tr>
<td><label>Address :</label></td>
<td><textarea name="ad" id="ad" > </textarea></td>
</tr>

<tr>
<td>Gender </td>
<td><input type="radio" name="gender" value="male" checked >Male
<input type="radio" name="gender" value="female">Female
</tr>

<tr>
<td colspan="2" align="center">

<input type="submit" value="submit" onclick="show()">

</td>
</tr>

</form>
</table>
</center>
</body>
</html>
